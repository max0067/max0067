<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossiers - RSS Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8f9fa;
            color: #1e293b;
        }

        /* NAVBAR - Identique au dashboard */
        .navbar {
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            font-size: 1.25rem;
            font-weight: 700;
            color: #667eea;
            text-decoration: none;
        }

        .navbar-menu {
            display: flex;
            gap: 0.5rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            color: #64748b;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background: #f1f5f9;
            color: #667eea;
        }

        .nav-link.active {
            background: #667eea;
            color: white;
        }

        .navbar-user {
            position: relative;
        }

        .user-button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9375rem;
            transition: all 0.2s;
        }

        .user-button:hover {
            border-color: #667eea;
            background: #fafafa;
        }

        .user-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 0.5rem);
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            min-width: 220px;
            overflow: hidden;
            display: none;
        }

        .user-dropdown.show {
            display: block;
        }

        .user-info {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            background: #f8f9fa;
        }

        .user-info-name {
            font-weight: 600;
            color: #0f172a;
            font-size: 0.9375rem;
        }

        .user-info-role {
            font-size: 0.8125rem;
            color: #64748b;
            margin-top: 0.25rem;
            text-transform: capitalize;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            text-decoration: none;
            color: #334155;
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background: #f8f9fa;
        }

        /* MAIN CONTENT */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9375rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            border-color: #667eea;
            background: #f8f9fa;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* FOLDERS GRID */
        .folders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .folder-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .folder-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .folder-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .folder-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .folder-info {
            flex: 1;
        }

        .folder-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }

        .folder-count {
            font-size: 0.875rem;
            color: #64748b;
        }

        .folder-description {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .folder-actions {
            display: flex;
            gap: 0.5rem;
        }

        .folder-actions button {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.875rem;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: #334155;
            margin-bottom: 0.5rem;
            font-size: 0.9375rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.9375rem;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        .color-picker-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: #0f172a;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #0f172a;
        }

        .modal-footer {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .modal-footer button {
            flex: 1;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #64748b;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 1.125rem;
            margin-bottom: 1.5rem;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .navbar {
                padding: 0.75rem 1rem;
            }

            .navbar-menu {
                display: none;
            }

            .main-content {
                padding: 1rem;
            }

            .page-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .folders-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <svg width="30" height="30" viewBox="0 0 50 50" style="margin-right: 10px;">
                <circle cx="25" cy="25" r="20" fill="url(#gradient)" />
                <circle cx="12" cy="38" r="3" fill="white" />
                <path d="M 12 32 Q 12 20, 24 20" stroke="white" stroke-width="3" fill="none" />
                <path d="M 12 26 Q 12 18, 20 18" stroke="white" stroke-width="3" fill="none" />
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#667eea" />
                        <stop offset="100%" style="stop-color:#764ba2" />
                    </linearGradient>
                </defs>
            </svg>
            <span>RSS Manager</span>
        </div>

        <div class="navbar-menu">
            <a href="/" class="nav-link">
                <span>🏠</span> Accueil
            </a>
            <a href="/dashboard" class="nav-link">
                <span>📊</span> Dashboard
            </a>
            <a href="/feeds" class="nav-link">
                <span>📡</span> Flux RSS
            </a>
            <a href="/folders" class="nav-link active">
                <span>📁</span> Dossiers
            </a>
        </div>

        <div class="navbar-user">
            <button class="user-button" id="user-menu-button">
                <span>👤</span>
                <span id="current-username">Utilisateur</span>
                <span>▼</span>
            </button>
            <div class="user-dropdown" id="user-dropdown">
                <div class="user-info">
                    <div class="user-info-name" id="dropdown-username">Utilisateur</div>
                    <div class="user-info-role" id="dropdown-role">user</div>
                </div>
                <a href="/admin" class="dropdown-item" id="admin-link" style="display: none;">
                    <span>👑</span> Administration
                </a>
                <a href="#" class="dropdown-item" id="logout-link">
                    <span>🚪</span> Déconnexion
                </a>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">📁 Mes Dossiers</h1>
            <button class="btn btn-primary" onclick="openCreateModal()">
                + Créer un dossier
            </button>
        </div>

        <div class="folders-grid" id="folders-container">
            <div class="empty-state">
                <div class="empty-state-icon">⏳</div>
                <p>Chargement des dossiers...</p>
            </div>
        </div>
    </div>

    <!-- Modal Créer/Modifier Dossier -->
    <div class="modal" id="folder-modal">
        <div class="modal-content">
            <h2 class="modal-header" id="modal-title">Créer un dossier</h2>
            <form id="folder-form" onsubmit="return false;">
                <div class="form-group">
                    <label class="form-label" for="folder-name">Nom du dossier *</label>
                    <input type="text" class="form-input" id="folder-name" required placeholder="Ex: Technologie, Sport, etc.">
                </div>

                <div class="form-group">
                    <label class="form-label" for="folder-description">Description</label>
                    <textarea class="form-input form-textarea" id="folder-description" placeholder="Description optionnelle du dossier"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Couleur</label>
                    <div class="color-picker-group">
                        <div class="color-option selected" data-color="#667eea" style="background: #667eea;"></div>
                        <div class="color-option" data-color="#f59e0b" style="background: #f59e0b;"></div>
                        <div class="color-option" data-color="#10b981" style="background: #10b981;"></div>
                        <div class="color-option" data-color="#ef4444" style="background: #ef4444;"></div>
                        <div class="color-option" data-color="#8b5cf6" style="background: #8b5cf6;"></div>
                        <div class="color-option" data-color="#ec4899" style="background: #ec4899;"></div>
                        <div class="color-option" data-color="#06b6d4" style="background: #06b6d4;"></div>
                        <div class="color-option" data-color="#64748b" style="background: #64748b;"></div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary" id="save-folder-btn">Créer</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let editingFolderId = null;
        let selectedColor = '#667eea';

        // Menu utilisateur
        document.getElementById('user-menu-button').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('user-dropdown').classList.toggle('show');
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.navbar-user')) {
                document.getElementById('user-dropdown').classList.remove('show');
            }
        });

        // Charger l'utilisateur
        async function loadUser() {
            try {
                const response = await fetch('/api/auth/me');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('current-username').textContent = data.user.username;
                    document.getElementById('dropdown-username').textContent = data.user.username;
                    document.getElementById('dropdown-role').textContent = data.user.role;
                    if (data.user.role === 'admin') {
                        document.getElementById('admin-link').style.display = 'flex';
                    }
                }
            } catch (error) {
                console.error('Erreur utilisateur:', error);
            }
        }

        // Color picker
        document.querySelectorAll('.color-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                selectedColor = this.dataset.color;
            });
        });

        // Modal functions
        function openCreateModal() {
            editingFolderId = null;
            document.getElementById('modal-title').textContent = 'Créer un dossier';
            document.getElementById('save-folder-btn').textContent = 'Créer';
            document.getElementById('folder-name').value = '';
            document.getElementById('folder-description').value = '';
            selectedColor = '#667eea';
            document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
            document.querySelector('.color-option[data-color="#667eea"]').classList.add('selected');
            document.getElementById('folder-modal').classList.add('show');
        }

        function openEditModal(folder) {
            editingFolderId = folder.id;
            document.getElementById('modal-title').textContent = 'Modifier le dossier';
            document.getElementById('save-folder-btn').textContent = 'Enregistrer';
            document.getElementById('folder-name').value = folder.name;
            document.getElementById('folder-description').value = folder.description || '';
            selectedColor = folder.color;
            document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
            const colorOption = document.querySelector(`.color-option[data-color="${folder.color}"]`);
            if (colorOption) colorOption.classList.add('selected');
            document.getElementById('folder-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('folder-modal').classList.remove('show');
        }

        // Charger les dossiers
        async function loadFolders() {
            try {
                const container = document.getElementById('folders-container');
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏳</div><p>Chargement...</p></div>';

                const response = await fetch('/api/folders');
                const data = await response.json();

                if (data.success && data.folders && data.folders.length > 0) {
                    container.innerHTML = data.folders.map(folder => `
                        <div class="folder-card" onclick="window.location.href='/folders/${folder.id}'">
                            <div class="folder-header">
                                <div class="folder-icon" style="background: ${folder.color}20; color: ${folder.color};">
                                    📁
                                </div>
                                <div class="folder-info">
                                    <div class="folder-name">${folder.name}</div>
                                    <div class="folder-count">${folder.article_count || 0} article${folder.article_count > 1 ? 's' : ''}</div>
                                </div>
                            </div>
                            ${folder.description ? `<div class="folder-description">${folder.description}</div>` : ''}
                            <div class="folder-actions" onclick="event.stopPropagation();">
                                <button class="btn btn-secondary" onclick="openEditModal(${JSON.stringify(folder).replace(/"/g, '&quot;')})">
                                    ✏️ Modifier
                                </button>
                                <button class="btn btn-danger" onclick="deleteFolder(${folder.id}, '${folder.name}')">
                                    🗑️ Supprimer
                                </button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📁</div>
                            <p class="empty-state-text">Aucun dossier créé</p>
                            <button class="btn btn-primary" onclick="openCreateModal()">
                                + Créer votre premier dossier
                            </button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Erreur chargement dossiers:', error);
                document.getElementById('folders-container').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Erreur lors du chargement des dossiers</p>
                    </div>
                `;
            }
        }

        // Sauvegarder dossier
        async function saveFolder(e) {
            e.preventDefault();

            const name = document.getElementById('folder-name').value.trim();
            const description = document.getElementById('folder-description').value.trim();

            const data = {
                name,
                description,
                color: selectedColor
            };

            try {
                let response;
                if (editingFolderId) {
                    response = await fetch(`/api/folders/${editingFolderId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                } else {
                    response = await fetch('/api/folders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                }

                const result = await response.json();

                if (result.success) {
                    closeModal();
                    loadFolders();
                } else {
                    alert('Erreur: ' + result.error);
                }
            } catch (error) {
                console.error('Erreur sauvegarde dossier:', error);
                alert('Erreur lors de la sauvegarde du dossier');
            }
        }

        // Supprimer dossier
        async function deleteFolder(id, name) {
            if (!confirm(`Êtes-vous sûr de vouloir supprimer le dossier "${name}" ? Les articles ne seront pas supprimés, seulement retirés du dossier.`)) {
                return;
            }

            try {
                const response = await fetch(`/api/folders/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.success) {
                    loadFolders();
                } else {
                    alert('Erreur: ' + result.error);
                }
            } catch (error) {
                console.error('Erreur suppression dossier:', error);
                alert('Erreur lors de la suppression du dossier');
            }
        }

        // Déconnexion
        document.getElementById('logout-link').addEventListener('click', async function(e) {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        });

        // Form submit
        document.getElementById('folder-form').addEventListener('submit', saveFolder);

        // Chargement initial
        loadUser();
        loadFolders();
    </script>
</body>
</html>
