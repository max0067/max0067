<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Flux RSS</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestionnaire de Flux RSS</h1>
            <div class="stats">
                <span id="stats-feeds">0 flux</span> |
                <span id="stats-articles">0 articles</span> |
                <span id="stats-unread">0 non lus</span>
            </div>
        </header>

        <div class="main-content">
            <!-- Sidebar avec les flux -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Flux RSS</h2>
                    <button id="btn-add-feed" class="btn btn-primary">+ Ajouter</button>
                </div>

                <div class="sidebar-actions">
                    <button id="btn-update-all" class="btn btn-secondary">Tout mettre à jour</button>
                    <button id="btn-show-all" class="btn btn-secondary">Tous les articles</button>
                </div>

                <div id="feeds-list" class="feeds-list">
                    <!-- Les flux seront affichés ici -->
                </div>
            </aside>

            <!-- Zone principale pour les articles -->
            <main class="content">
                <div class="content-header">
                    <h2 id="articles-title">Tous les articles</h2>
                    <div class="filters">
                        <label>
                            <input type="checkbox" id="filter-unread"> Non lus seulement
                        </label>
                    </div>
                </div>

                <div id="articles-list" class="articles-list">
                    <!-- Les articles seront affichés ici -->
                </div>

                <div id="loading" class="loading" style="display: none;">
                    Chargement...
                </div>

                <div id="no-articles" class="no-content" style="display: none;">
                    Aucun article à afficher
                </div>
            </main>
        </div>
    </div>

    <!-- Modal pour ajouter/modifier un flux -->
    <div id="feed-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Ajouter un flux RSS</h2>

            <form id="feed-form">
                <input type="hidden" id="feed-id">

                <div class="form-group">
                    <label for="feed-title">Titre:</label>
                    <input type="text" id="feed-title" placeholder="Titre du flux" required>
                </div>

                <div class="form-group">
                    <label for="feed-url">URL du flux RSS:</label>
                    <input type="url" id="feed-url" placeholder="https://example.com/feed.xml" required>
                </div>

                <div class="form-group">
                    <label for="feed-description">Description:</label>
                    <textarea id="feed-description" placeholder="Description du flux" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="feed-interval">Intervalle de mise à jour (minutes):</label>
                    <input type="number" id="feed-interval" min="5" value="30">
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="feed-active" checked>
                        Flux actif
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                    <button type="button" class="btn btn-secondary" id="btn-cancel">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal pour afficher un article -->
    <div id="article-modal" class="modal">
        <div class="modal-content modal-large">
            <span class="close">&times;</span>
            <div id="article-detail">
                <!-- Le contenu de l'article sera affiché ici -->
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
