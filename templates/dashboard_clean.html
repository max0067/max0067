<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RSS Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8f9fa;
            color: #1e293b;
        }

        /* NAVBAR - Identique à l'accueil */
        .navbar {
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            font-size: 1.25rem;
            font-weight: 700;
            color: #667eea;
            text-decoration: none;
        }

        .navbar-menu {
            display: flex;
            gap: 0.5rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            color: #64748b;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background: #f1f5f9;
            color: #667eea;
        }

        .nav-link.active {
            background: #667eea;
            color: white;
        }

        .navbar-user {
            position: relative;
        }

        .user-button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9375rem;
            transition: all 0.2s;
        }

        .user-button:hover {
            border-color: #667eea;
            background: #fafafa;
        }

        .user-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 0.5rem);
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            min-width: 220px;
            overflow: hidden;
            display: none;
        }

        .user-dropdown.show {
            display: block;
        }

        .user-info {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            background: #f8f9fa;
        }

        .user-info-name {
            font-weight: 600;
            color: #0f172a;
            font-size: 0.9375rem;
        }

        .user-info-role {
            font-size: 0.8125rem;
            color: #64748b;
            margin-top: 0.25rem;
            text-transform: capitalize;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            text-decoration: none;
            color: #334155;
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background: #f8f9fa;
        }

        /* MAIN CONTENT */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: #64748b;
            font-size: 1rem;
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.2s;
        }

        .stat-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .stat-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 2.25rem;
            font-weight: 700;
            color: #0f172a;
        }

        /* CARD */
        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
        }

        .card-header h2 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #0f172a;
        }

        .card-body {
            padding: 0;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            border-color: #667eea;
            background: #f8f9fa;
        }

        /* ARTICLES */
        .article-item {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
            cursor: pointer;
        }

        .article-item:last-child {
            border-bottom: none;
        }

        .article-item:hover {
            background: #f8f9fa;
        }

        .article-title {
            font-size: 1rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        .article-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 0.875rem;
            color: #64748b;
        }

        .article-meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: #64748b;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .navbar {
                padding: 0.75rem 1rem;
            }

            .navbar-menu {
                display: none;
            }

            .main-content {
                padding: 1rem;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stat-value {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <svg width="30" height="30" viewBox="0 0 50 50" style="margin-right: 10px;">
                <circle cx="25" cy="25" r="20" fill="url(#gradient)" />
                <circle cx="12" cy="38" r="3" fill="white" />
                <path d="M 12 32 Q 12 20, 24 20" stroke="white" stroke-width="3" fill="none" />
                <path d="M 12 26 Q 12 18, 20 18" stroke="white" stroke-width="3" fill="none" />
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#667eea" />
                        <stop offset="100%" style="stop-color:#764ba2" />
                    </linearGradient>
                </defs>
            </svg>
            <span>RSS Manager</span>
        </div>

        <div class="navbar-menu">
            <a href="/" class="nav-link">
                <span>🏠</span> Accueil
            </a>
            <a href="/dashboard" class="nav-link active">
                <span>📊</span> Dashboard
            </a>
            <a href="/feeds" class="nav-link">
                <span>📡</span> Flux RSS
            </a>
        </div>

        <div class="navbar-user">
            <button class="user-button" id="user-menu-button">
                <span>👤</span>
                <span id="current-username">Utilisateur</span>
                <span>▼</span>
            </button>
            <div class="user-dropdown" id="user-dropdown">
                <div class="user-info">
                    <div class="user-info-name" id="dropdown-username">Utilisateur</div>
                    <div class="user-info-role" id="dropdown-role">user</div>
                </div>
                <a href="/admin" class="dropdown-item" id="admin-link" style="display: none;">
                    <span>👑</span> Administration
                </a>
                <a href="#" class="dropdown-item" id="logout-link">
                    <span>🚪</span> Déconnexion
                </a>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-header">
            <h1>📊 Dashboard</h1>
            <p>Vue d'ensemble de vos flux RSS partagés</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon">📡</div>
                    <div class="stat-label">Flux RSS</div>
                </div>
                <div class="stat-value" id="stat-feeds">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon">📄</div>
                    <div class="stat-label">Articles</div>
                </div>
                <div class="stat-value" id="stat-articles">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon">⏱️</div>
                    <div class="stat-label">Non lus</div>
                </div>
                <div class="stat-value" id="stat-unread">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon">⭐</div>
                    <div class="stat-label">Favoris</div>
                </div>
                <div class="stat-value" id="stat-favorites">0</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>📰 Derniers articles</h2>
                <button class="btn btn-secondary" onclick="loadArticles()">
                    🔄 Actualiser
                </button>
            </div>
            <div class="card-body" id="articles-container">
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <p>Chargement des articles...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Menu utilisateur
        document.getElementById('user-menu-button').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('user-dropdown').classList.toggle('show');
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.navbar-user')) {
                document.getElementById('user-dropdown').classList.remove('show');
            }
        });

        // Charger l'utilisateur
        async function loadUser() {
            try {
                const response = await fetch('/api/auth/me');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('current-username').textContent = data.user.username;
                    document.getElementById('dropdown-username').textContent = data.user.username;
                    document.getElementById('dropdown-role').textContent = data.user.role;
                    if (data.user.role === 'admin') {
                        document.getElementById('admin-link').style.display = 'flex';
                    }
                }
            } catch (error) {
                console.error('Erreur utilisateur:', error);
            }
        }

        // Charger les stats
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('stat-feeds').textContent = data.stats.total_feeds || 0;
                    document.getElementById('stat-articles').textContent = data.stats.total_articles || 0;
                    document.getElementById('stat-unread').textContent = data.stats.unread_articles || 0;
                    document.getElementById('stat-favorites').textContent = data.stats.favorites || 0;
                }
            } catch (error) {
                console.error('Erreur stats:', error);
            }
        }

        // Charger les articles
        async function loadArticles() {
            try {
                const container = document.getElementById('articles-container');
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏳</div><p>Chargement...</p></div>';

                const response = await fetch('/api/articles?limit=20');
                const data = await response.json();

                if (data.success && data.articles && data.articles.length > 0) {
                    container.innerHTML = data.articles.map(article => `
                        <div class="article-item" onclick="window.open('${article.link}', '_blank')">
                            <div class="article-title">${article.title}</div>
                            <div class="article-meta">
                                <span>📡 ${article.feed_title || 'RSS Feed'}</span>
                                <span>📅 ${new Date(article.published_date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>Aucun article disponible</p></div>';
                }
            } catch (error) {
                console.error('Erreur articles:', error);
                document.getElementById('articles-container').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>Erreur lors du chargement des articles</p></div>';
            }
        }

        // Déconnexion
        document.getElementById('logout-link').addEventListener('click', async function(e) {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        });

        // Chargement initial
        loadUser();
        loadStats();
        loadArticles();
    </script>
</body>
</html>
