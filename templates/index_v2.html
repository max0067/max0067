<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Manager - Veille Juridique Ultra-Moderne</title>
    <link rel="stylesheet" href="/static/css/style_v2.css">
    <link rel="stylesheet" href="/static/css/style_modern_v3.css">
</head>
<body>
    <div class="app-container">
        <!-- Navigation moderne -->
        <nav class="navbar">
            <div class="navbar-brand">
                <svg width="30" height="30" viewBox="0 0 50 50" style="margin-right: 10px;">
                    <circle cx="25" cy="25" r="20" fill="url(#gradient)" />
                    <circle cx="12" cy="38" r="3" fill="white" />
                    <path d="M 12 32 Q 12 20, 24 20" stroke="white" stroke-width="3" fill="none" />
                    <path d="M 12 26 Q 12 18, 20 18" stroke="white" stroke-width="3" fill="none" />
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#667eea" />
                            <stop offset="100%" style="stop-color:#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <span>RSS Manager</span>
            </div>

            <button class="menu-toggle" id="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="navbar-menu" id="navbar-menu">
                <a href="/" class="nav-link active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                    <span>Accueil</span>
                    <span class="unread-badge" id="unread-badge" style="display: none;">0</span>
                </a>
                <a href="/dashboard" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="/feeds" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 11a9 9 0 0 1 9 9"></path>
                        <path d="M4 4a16 16 0 0 1 16 16"></path>
                        <circle cx="5" cy="19" r="1"></circle>
                    </svg>
                    <span>Gérer les flux</span>
                </a>
                <a href="#" class="nav-link" id="favorites-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    <span>Favoris</span>
                </a>
            </div>

            <div class="navbar-user">
                <div class="user-menu">
                    <button class="user-button" id="user-menu-button">
                        <span class="user-avatar">👤</span>
                        <span class="user-name" id="current-username">Utilisateur</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div class="user-dropdown" id="user-dropdown" style="display: none;">
                        <div class="user-info">
                            <div class="user-info-name" id="dropdown-username">Utilisateur</div>
                            <div class="user-info-role" id="dropdown-role">user</div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <a href="/admin" class="dropdown-item admin-only" id="admin-link" style="display: none;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2L2 7v10c0 5.5 4.5 10 10 10s10-4.5 10-10V7l-10-5z"></path>
                            </svg>
                            <span>Administration</span>
                        </a>
                        <a href="#" class="dropdown-item" id="logout-link">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            <span>Déconnexion</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Barre de recherche ultra-moderne -->
        <div class="search-bar">
            <div class="search-container">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Rechercher des lois, décrets, articles juridiques..." />
                    <button class="search-clear" id="search-clear" style="display: none;">✕</button>
                </div>
                <div class="search-stats" id="search-stats"></div>
            </div>
        </div>

        <!-- Contenu principal -->
        <div class="main-content-simple">
            <!-- En-tête avec filtres -->
            <div class="content-header">
                <h2 id="articles-title">Tous les articles</h2>
                <div class="filters">
                    <label class="filter-checkbox">
                        <input type="checkbox" id="filter-unread">
                        <span>Non lus seulement</span>
                    </label>
                    <button class="btn-mark-all-read" id="btn-mark-all-read">
                        ✓ Marquer tout comme lu
                    </button>
                </div>
            </div>

            <!-- Liste des articles -->
            <div id="articles-list" class="articles-list">
                <!-- Les articles seront affichés ici -->
            </div>

            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Chargement...</p>
            </div>

            <div id="no-articles" class="no-content" style="display: none;">
                <div class="empty-icon">📭</div>
                <p>Aucun article à afficher</p>
                <p class="empty-subtitle">Vos articles RSS apparaîtront ici</p>
            </div>
        </div>
    </div>

    <!-- Modal pour afficher un article -->
    <div id="article-modal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <button class="modal-close">&times;</button>
            </div>
            <div id="article-detail" class="article-detail">
                <!-- Le contenu de l'article sera affiché ici -->
            </div>
        </div>
    </div>

    <script src="/static/js/app_v2.js"></script>
</body>
</html>
